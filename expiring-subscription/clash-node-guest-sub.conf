# 限时访客订阅目录：/var/lib/clash-node/sub/<32 位十六进制 token>.yaml
# 文件在到期后被 expire.sh 删除，此 location 随即返回 410 Gone。
# Subscription-Userinfo 让客户端（Clash Verge / Mihomo）自己显示到期时间，
# 但真正的失效闸门是服务端撤销 UUID —— 客户端头只是显示，不做拦截。
# 注意：本块要放在 `location / { return 404; }` 之前。
location ~ ^/([a-f0-9]{32})\.yaml$ {
    root /var/lib/clash-node/sub;
    default_type application/yaml;
    add_header Cache-Control "private, no-store" always;
    add_header Subscription-Userinfo $clash_guest_userinfo always;
    try_files /$1.yaml =410;
}
